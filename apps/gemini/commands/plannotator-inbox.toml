description = "Open the Plannotator Inbox in the browser (starting it if needed) and show its address"
prompt = """
## Inbox address

!{plannotator inbox --open}

## Your task

The output above is the Plannotator Inbox's address, and the Inbox is now open in the browser. Tell the user the address in one sentence and stop. Do not begin any work. If the output is an error, tell the user what it says; `Unknown inbox option: --open` means their Plannotator is older than this command (update with `plannotator update`, or run `plannotator inbox` in a terminal).
"""
